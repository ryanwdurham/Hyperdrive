<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HYPER DRIVE: NEON HIGHWAY</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@400;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body { margin: 0; background: #000; font-family: 'Orbitron', sans-serif; touch-action: none; user-select: none; }
        canvas { display: block; width: 100%; height: 100%; }
        
        #controls { position: absolute; top: 75px; left: 12px; display: flex; gap: 8px; z-index: 150; }
        .control-btn { width: 40px; height: 40px; background: rgba(0,20,40,0.9); border: 2px solid #0ff; border-radius: 6px; color: #0ff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; box-shadow: 0 0 12px rgba(0,255,255,0.3); }
        .control-btn:hover { background: rgba(0,255,255,0.2); transform: scale(1.05); }
        .control-btn.active { background: rgba(255,0,85,0.3); border-color: #f05; color: #f05; }
        
        #hud { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; z-index: 100; }
        #scorePanel { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 10px 12px; background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%); }
        .stat-group { text-align: left; }
        .stat-group.right { text-align: right; }
        .stat-label { font-size: 7px; letter-spacing: 1.5px; color: #0ff; text-shadow: 0 0 8px #0ff; opacity: 0.8; margin-bottom: 2px; }
        .stat-value { font-size: 20px; font-weight: 900; color: #fff; text-shadow: 0 0 12px #0ff; font-family: 'Audiowide', cursive; }
        #weaponPower { font-size: 14px; color: #ff0; text-shadow: 0 0 10px #ff0; }
        
        #mobileControls { position: absolute; bottom: 0; left: 0; width: 100%; height: 150px; display: none; z-index: 101; background: linear-gradient(0deg, rgba(0,0,0,0.7), transparent); }
        #mobileControls.active { display: flex; }
        .control-area { flex: 1; display: flex; align-items: center; justify-content: center; }
        .btn-move { width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle, rgba(0,255,255,0.4), rgba(0,255,255,0.1)); border: 3px solid #0ff; box-shadow: 0 0 20px #0ff; font-size: 32px; color: #0ff; display: flex; align-items: center; justify-content: center; font-weight: 900; }
        .btn-move:active { transform: scale(0.9); }
        
        #message { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); font-size: 42px; font-weight: 900; color: #fff; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 102; text-align: center; font-family: 'Audiowide', cursive; white-space: pre-line; letter-spacing: 2px; }
        #message.show { opacity: 1; transform: translate(-50%, -50%) scale(1.05); animation: messagePulse 0.5s ease; }
        
        @keyframes messagePulse { 0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0; } 50% { transform: translate(-50%, -50%) scale(1.1); } 100% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; } }
        
        #achievementFlash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 101; opacity: 0; transition: opacity 0.3s; }
        #achievementFlash.flash { animation: colorFlash 3s ease; }
        
        @keyframes colorFlash { 
            0% { opacity: 0; background: transparent; } 
            5% { opacity: 0.4; } 
            20% { opacity: 0.3; } 
            100% { opacity: 0; background: transparent; } 
        }
        
        #lowHealthWarning { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,0,0,0.25); pointer-events: none; z-index: 99; opacity: 0; transition: opacity 0.3s; }
        #lowHealthWarning.show { opacity: 1; animation: lowHealthPulse 1s infinite; }
        
        @keyframes lowHealthPulse { 0%, 100% { background: rgba(255,0,0,0.2); } 50% { background: rgba(255,0,0,0.35); } }
        
        #startScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0a0a1e 0%, #1a0a2e 50%, #0a0a1e 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; overflow: hidden; }
        #startScreen.hidden { display: none; }
        .game-title { font-family: 'Audiowide', cursive; font-size: 68px; background: linear-gradient(45deg, #0ff, #f0f, #ff0, #0ff); background-size: 200% 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; animation: gradientShift 3s ease infinite; text-align: center; }
        .game-subtitle { font-size: 26px; color: #f0f; text-shadow: 0 0 15px #f0f; margin-bottom: 30px; letter-spacing: 10px; text-align: center; }
        
        .difficulty-selector { margin-bottom: 40px; display: flex; gap: 20px; }
        .diff-btn { padding: 18px 50px; font-size: 24px; font-family: 'Audiowide', cursive; background: rgba(0,40,80,0.6); border: 3px solid #0ff; color: #0ff; cursor: pointer; border-radius: 10px; transition: 0.3s; text-shadow: 0 0 10px #0ff; }
        .diff-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px #0ff; }
        .diff-btn.selected { background: linear-gradient(135deg, #0ff, #0af); color: #000; border-color: #fff; box-shadow: 0 0 40px #0ff; }
        .diff-btn.hard { border-color: #f05; color: #f05; text-shadow: 0 0 10px #f05; }
        .diff-btn.hard.selected { background: linear-gradient(135deg, #f05, #f0f); color: #fff; border-color: #fff; box-shadow: 0 0 40px #f05; }
        
        .start-btn { padding: 20px 65px; font-size: 30px; font-family: 'Audiowide', cursive; background: linear-gradient(135deg, #f05, #f0f, #05f); background-size: 200%; border: none; color: #fff; cursor: pointer; box-shadow: 0 0 40px #f0f; border-radius: 12px; transition: 0.3s; animation: gradientShift 3s ease infinite; }
        .start-btn:hover { transform: scale(1.08); }
        
        #gameOverScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: flex-start; z-index: 201; overflow-y: auto; padding: 20px 10px; box-sizing: border-box; cursor: auto; }
        #gameOverScreen.show { display: flex; }
        .game-over-title { font-family: 'Audiowide', cursive; font-size: 50px; color: #f05; text-shadow: 0 0 30px #f05; margin: 20px 0; }
        .final-stats { background: rgba(0,20,40,0.8); border: 3px solid #0ff; border-radius: 15px; padding: 25px 45px; margin-bottom: 20px; box-shadow: 0 0 30px rgba(0,255,255,0.5); }
        .final-stat { display: flex; justify-content: space-between; gap: 40px; margin: 12px 0; font-size: 22px; color: #0ff; }
        .final-stat-value { color: #fff; font-family: 'Audiowide', cursive; }
        .play-again-wrapper { margin: 20px 0; }
        .high-scores { background: rgba(20,0,40,0.8); border: 3px solid #f0f; border-radius: 15px; padding: 20px 35px; margin-bottom: 30px; max-width: 450px; width: 100%; }
        .high-scores-title { font-family: 'Audiowide', cursive; font-size: 26px; color: #f0f; text-shadow: 0 0 15px #f0f; margin-bottom: 15px; text-align: center; }
        .high-score-entry { display: flex; justify-content: space-between; padding: 6px 12px; margin: 4px 0; background: rgba(0,0,0,0.4); border-radius: 5px; font-size: 16px; }
        .high-score-entry.current { background: rgba(255,215,0,0.2); border: 2px solid #ffd700; }
        .high-score-rank { color: #ff0; font-weight: bold; }
        .high-score-score { color: #0ff; font-family: 'Audiowide', cursive; }
        
        .achievements-section { background: rgba(20,0,40,0.8); border: 3px solid #f0f; border-radius: 15px; padding: 20px 35px; margin-bottom: 20px; max-width: 600px; width: 100%; }
        .achievements-title { font-family: 'Audiowide', cursive; font-size: 26px; color: #f0f; text-shadow: 0 0 15px #f0f; margin-bottom: 15px; text-align: center; }
        .achievement-item { display: flex; align-items: center; gap: 15px; padding: 10px; margin: 8px 0; background: rgba(0,0,0,0.4); border-radius: 8px; border-left: 4px solid transparent; }
        .achievement-item.earned { border-left-color: #0ff; background: rgba(0,255,255,0.1); }
        .achievement-badge { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; background: rgba(0,0,0,0.6); border: 3px solid #666; }
        .achievement-badge.earned { border-color: #0ff; background: rgba(0,255,255,0.2); animation: glow 2s infinite; }
        .achievement-info { flex: 1; }
        .achievement-name { font-size: 16px; color: #0ff; font-weight: bold; }
        .achievement-desc { font-size: 12px; color: #888; }
        .achievement-count { font-size: 20px; color: #ff0; font-family: 'Audiowide'; }
        
        @keyframes glow { 0%, 100% { box-shadow: 0 0 10px #0ff; } 50% { box-shadow: 0 0 20px #0ff; } }
        
        #bossWarning { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,0,0,0.4); display: none; justify-content: center; align-items: center; z-index: 150; animation: bossFlash 0.5s infinite; pointer-events: none; }
        #bossWarning.show { display: flex; }
        #bossWarning h1 { font-family: 'Audiowide'; font-size: 58px; color: #ff0000; text-shadow: 0 0 40px #ff0000, 0 0 80px #ff0000; animation: bossTextBlink 0.3s infinite; letter-spacing: 3px; white-space: nowrap; }
        
        @keyframes bossFlash { 0%, 100% { background: rgba(255,0,0,0.3); } 50% { background: rgba(255,0,0,0.5); } }
        @keyframes bossTextBlink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.05); } }
        @keyframes gradientShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        
        @media (max-width: 768px) {
            .game-title { font-size: 46px; }
            .game-subtitle { font-size: 18px; letter-spacing: 6px; }
            .diff-btn { font-size: 18px; padding: 14px 35px; }
            .difficulty-selector { gap: 12px; }
            .start-btn { font-size: 24px; padding: 16px 45px; }
            .stat-value { font-size: 17px; }
            #scorePanel { grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 8px; }
            #controls { top: 60px; }
            #message { font-size: 32px; }
            #bossWarning h1 { font-size: 42px; }
            .game-over-title { font-size: 38px; margin: 10px 0; }
            .final-stats { padding: 20px 25px; }
            .final-stat { font-size: 18px; gap: 20px; }
            .achievements-section { padding: 15px 20px; }
            .achievement-badge { width: 40px; height: 40px; font-size: 20px; }
            .achievement-name { font-size: 14px; }
            .achievement-desc { font-size: 11px; }
            .high-scores { padding: 15px 20px; }
            .high-score-entry { font-size: 14px; }
        }
    </style>
</head>
<body>
<canvas id="game"></canvas>
<div id="lowHealthWarning"></div>
<div id="achievementFlash"></div>
<div id="controls">
    <div class="control-btn" id="pauseBtn">⏸</div>
    <div class="control-btn" id="muteBtn">🔊</div>
</div>
<div id="hud">
    <div id="scorePanel">
        <div class="stat-group"><div class="stat-label">SCORE</div><div class="stat-value" id="score">000000</div></div>
        <div class="stat-group"><div class="stat-label">COINS</div><div class="stat-value" id="coins">0</div></div>
        <div class="stat-group"><div class="stat-label">TIME</div><div class="stat-value" id="time">0:00</div></div>
        <div class="stat-group right"><div class="stat-label">HEALTH</div><div class="stat-value" id="health">100%</div></div>
        <div class="stat-group right"><div class="stat-label">WEAPON</div><div class="stat-value" id="weaponType">BLASTER</div><div id="weaponPower"></div></div>
    </div>
</div>
<div id="mobileControls">
    <div class="control-area"><div class="btn-move" id="btnLeft">◄</div></div>
    <div class="control-area"><div class="btn-move" id="btnRight">►</div></div>
</div>
<div id="bossWarning"><h1>⚠ WARNING: BOSS APPROACHING ⚠</h1></div>
<div id="message"></div>
<div id="startScreen">
    <div class="game-title">HYPER DRIVE</div>
    <div class="game-subtitle">NEON HIGHWAY</div>
    <div class="difficulty-selector">
        <div class="diff-btn selected" id="easyBtn">EASY</div>
        <div class="diff-btn hard" id="hardBtn">HARD</div>
    </div>
    <button class="start-btn" id="startBtn">BEGIN MISSION</button>
</div>
<div id="gameOverScreen">
    <div class="game-over-title">MISSION COMPLETE</div>
    <div class="final-stats">
        <div class="final-stat"><span>Final Score:</span><span class="final-stat-value" id="finalScore">0</span></div>
        <div class="final-stat"><span>Enemies Killed:</span><span class="final-stat-value" id="finalKills">0</span></div>
        <div class="final-stat"><span>Coins:</span><span class="final-stat-value" id="finalCoins">0</span></div>
        <div class="final-stat"><span>Coin Bonus:</span><span class="final-stat-value" id="coinBonus">0</span></div>
        <div class="final-stat"><span>Time:</span><span class="final-stat-value" id="finalTime">0:00</span></div>
        <div class="final-stat"><span>Difficulty:</span><span class="final-stat-value" id="finalDiff">EASY</span></div>
    </div>
    <div class="achievements-section">
        <div class="achievements-title">IN-GAME ACHIEVEMENTS</div>
        <div id="achievementsList"></div>
    </div>
    <div class="play-again-wrapper">
        <button class="start-btn" id="playAgainBtn">PLAY AGAIN</button>
    </div>
    <div class="high-scores">
        <div class="high-scores-title">TOP 10 HIGH SCORES</div>
        <div id="highScoresList"></div>
    </div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const isMobile=/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)||window.innerWidth<768;
let soundEnabled=true,SOUNDS={},audioContext,currentMusicTrack=0,selectedDifficulty='easy',musicTracks=['music1','music2','music3','music4'],trackPlayOrder=[],musicPausedTime=0,currentMusicVolume=0.3,targetMusicVolume=0.3,musicFading=false;

const ACHIEVEMENTS={
    coldBlooded:{name:"COLD BLOODED",desc:"Destroy 75 enemies",icon:"💀",bonus:5000,count:0,color:'rgba(255,0,0,0.5)'},
    coinCollector:{name:"COIN COLLECTOR",desc:"Collect 75 coins",icon:"💰",bonus:5000,count:0,color:'rgba(255,215,0,0.5)'},
    untouchable:{name:"SURVIVOR",desc:"Survival Bonus every 2 minutes",icon:"🛡️",bonus:10000,count:0,color:'rgba(0,255,255,0.5)'}
};

function initAudioContext(){
    if(!audioContext){
        try{
            audioContext=new(window.AudioContext||window.webkitAudioContext)();
            if(audioContext.state==='suspended')audioContext.resume()
        }catch(e){console.log('AudioContext not supported')}
    }
}

function initSounds(){
    initAudioContext();
    musicTracks.forEach(t=>{try{const s=new Audio(`sounds/${t}.mp3`);s.volume=0.3;s.loop=false;SOUNDS[t]=s}catch(e){}});
    ['explosion','explosion2','explosion3'].forEach(e=>{try{const s=new Audio(`sounds/${e}.mp3`);s.volume=0.2;SOUNDS[e]=s}catch(er){}});
    const shootPool=[];
    for(let i=0;i<5;i++){
        try{const s=new Audio('sounds/laser.mp3');s.volume=0.09;shootPool.push(s)}catch(e){}
    }
    SOUNDS.shootPool=shootPool;
    SOUNDS.shootIndex=0;
    const laserPool=[];
    for(let i=0;i<3;i++){
        try{const s=new Audio('sounds/laser7.mp3');s.volume=0.12;laserPool.push(s)}catch(e){}
    }
    SOUNDS.laserPool=laserPool;
    SOUNDS.laserIndex=0;
    const triplePool=[];
    for(let i=0;i<3;i++){
        try{const s=new Audio('sounds/laser4.mp3');s.volume=0.10;triplePool.push(s)}catch(e){}
    }
    SOUNDS.triplePool=triplePool;
    SOUNDS.tripleIndex=0;
    const plasmaPool=[];
    for(let i=0;i<3;i++){
        try{const s=new Audio('sounds/laser333.mp3');s.volume=0.11;plasmaPool.push(s)}catch(e){}
    }
    SOUNDS.plasmaPool=plasmaPool;
    SOUNDS.plasmaIndex=0;
    try{SOUNDS.powerup=new Audio('sounds/powerup.mp3');SOUNDS.powerup.volume=0.25}catch(e){}
    try{SOUNDS.hit=new Audio('sounds/hit.mp3');SOUNDS.hit.volume=0.2}catch(e){}
    try{SOUNDS.coin=new Audio('sounds/coin2.mp3');SOUNDS.coin.volume=0.18}catch(e){}
}

function playSound(n){
    if(!soundEnabled)return;
    initAudioContext();
    if(n==='shoot'){
        if(SOUNDS.shootPool&&SOUNDS.shootPool.length>0){
            try{
                const s=SOUNDS.shootPool[SOUNDS.shootIndex];
                SOUNDS.shootIndex=(SOUNDS.shootIndex+1)%SOUNDS.shootPool.length;
                s.currentTime=0;
                s.play().then(()=>{}).catch(e=>{})
            }catch(e){}
        }
    }else if(n==='laser'){
        if(SOUNDS.laserPool&&SOUNDS.laserPool.length>0){
            try{
                const s=SOUNDS.laserPool[SOUNDS.laserIndex];
                SOUNDS.laserIndex=(SOUNDS.laserIndex+1)%SOUNDS.laserPool.length;
                s.currentTime=0;
                s.play().then(()=>{}).catch(e=>{})
            }catch(e){}
        }
    }else if(n==='triple'){
        if(SOUNDS.triplePool&&SOUNDS.triplePool.length>0){
            try{
                const s=SOUNDS.triplePool[SOUNDS.tripleIndex];
                SOUNDS.tripleIndex=(SOUNDS.tripleIndex+1)%SOUNDS.triplePool.length;
                s.currentTime=0;
                s.play().then(()=>{}).catch(e=>{})
            }catch(e){}
        }
    }else if(n==='plasma'){
        if(SOUNDS.plasmaPool&&SOUNDS.plasmaPool.length>0){
            try{
                const s=SOUNDS.plasmaPool[SOUNDS.plasmaIndex];
                SOUNDS.plasmaIndex=(SOUNDS.plasmaIndex+1)%SOUNDS.plasmaPool.length;
                s.currentTime=0;
                s.play().then(()=>{}).catch(e=>{})
            }catch(e){}
        }
    }else if(n.startsWith('explosion')){
        const exs=['explosion','explosion2','explosion3'].filter(e=>SOUNDS[e]);
        if(exs.length>0){
            const ex=exs[Math.floor(Math.random()*exs.length)];
            try{
                const s=SOUNDS[ex];
                if(s){
                    s.currentTime=0;
                    s.volume=0.2;
                    s.play().then(()=>{}).catch(e=>{})
                }
            }catch(e){}
        }
    }else if(SOUNDS[n]){
        try{
            const s=SOUNDS[n];
            s.currentTime=0;
            s.play().then(()=>{}).catch(e=>{})
        }catch(e){}
    }
}

function shuffleTracks(){trackPlayOrder=[...musicTracks];for(let i=trackPlayOrder.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[trackPlayOrder[i],trackPlayOrder[j]]=[trackPlayOrder[j],trackPlayOrder[i]]}}

function playNextMusic(){
    if(soundEnabled&&trackPlayOrder.length>0){
        initAudioContext();
        const track=trackPlayOrder[currentMusicTrack%trackPlayOrder.length];
        if(SOUNDS[track]){
            SOUNDS[track].currentTime=musicPausedTime;
            SOUNDS[track].volume=0;
            SOUNDS[track].play().then(()=>{
                let fadeInVol=0;
                const fadeIn=setInterval(()=>{
                    fadeInVol+=0.02;
                    if(fadeInVol>=currentMusicVolume){
                        SOUNDS[track].volume=currentMusicVolume;
                        clearInterval(fadeIn)
                    }else{
                        SOUNDS[track].volume=fadeInVol
                    }
                },50)
            }).catch(e=>{});
            SOUNDS[track].onended=()=>{
                currentMusicTrack++;
                musicPausedTime=0;
                if(GS.run&&!GS.pause){
                    setTimeout(()=>playNextMusic(),200)
                }
            }
        }
    }
}

function updateDynamicMusic(){
    if(!GS.run||GS.pause)return;
    if(GS.tier>=9){
        targetMusicVolume=0.45
    }else if(GS.tier>=7){
        targetMusicVolume=0.42
    }else if(GS.tier>=5){
        targetMusicVolume=0.38
    }else if(GS.tier>=3){
        targetMusicVolume=0.35
    }else if(GS.tier>=1){
        targetMusicVolume=0.32
    }else{
        targetMusicVolume=0.3
    }
    if(Math.abs(currentMusicVolume-targetMusicVolume)>0.01){
        const diff=(targetMusicVolume-currentMusicVolume)*0.05;
        currentMusicVolume+=diff;
        const track=trackPlayOrder[currentMusicTrack%trackPlayOrder.length];
        if(SOUNDS[track]&&!SOUNDS[track].paused){
            SOUNDS[track].volume=currentMusicVolume
        }
    }
}

function pauseMusic(){
    const track=trackPlayOrder[currentMusicTrack%trackPlayOrder.length];
    if(SOUNDS[track]&&!SOUNDS[track].paused){
        musicPausedTime=SOUNDS[track].currentTime;
        SOUNDS[track].pause()
    }
}

function stopAllMusic(){musicTracks.forEach(t=>{if(SOUNDS[t])SOUNDS[t].pause()});musicPausedTime=0}
function unlockMouse(){
    if(document.exitPointerLock)document.exitPointerLock();
    else if(document.mozExitPointerLock)document.mozExitPointerLock();
    GS.fire=false;
    GS.mvL=false;
    GS.mvR=false;
    GS.mvU=false;
    GS.mvD=false;
    mouseLocked=false
}

function getHighScores(diff){try{const s=localStorage.getItem(`hyperDriveHS_${diff}`);return s?JSON.parse(s):[]}catch(e){return[]}}
function saveHighScore(sc,co,ti,diff){try{const hs=getHighScores(diff),ns={score:sc,coins:co,time:ti,date:new Date().toLocaleDateString()};hs.push(ns);hs.sort((a,b)=>b.score-a.score);hs.splice(10);localStorage.setItem(`hyperDriveHS_${diff}`,JSON.stringify(hs));return hs.findIndex(s=>s===ns)}catch(e){return-1}}

function displayAchievements(){
    const lst=document.getElementById('achievementsList');
    lst.innerHTML='';
    let totalBonus=0;
    Object.keys(ACHIEVEMENTS).forEach(key=>{
        const ach=ACHIEVEMENTS[key];
        const achBonus=ach.count*ach.bonus;
        totalBonus+=achBonus;
        const div=document.createElement('div');
        div.className='achievement-item'+(ach.count>0?' earned':'');
        div.innerHTML=`
            <div class="achievement-badge${ach.count>0?' earned':''}">${ach.icon}</div>

                <div class="achievement-name">${ach.name}</div>

            </div>
            <div class="achievement-count">${ach.count>0?ach.count+'x':''}</div>
        `;
        lst.appendChild(div)

    const bossBonus=GS.bossCount*(GS.diff==='easy'?25000:40000);

        const bossDiv=document.createElement('div');

        bossDiv.innerHTML=`

        `;
        lst.appendChild(bossDiv)

}

function fadeMusic(targetVol,duration){
    if(!SOUNDS[trackPlayOrder[currentMusicTrack%trackPlayOrder.length]])return;
    const currentTrack=SOUNDS[trackPlayOrder[currentMusicTrack%trackPlayOrder.length]];
    const startVol=currentTrack.volume;
    const step=(targetVol-startVol)/(duration*20);
    const fadeInterval=setInterval(()=>{
        if(!currentTrack||currentTrack.paused){
            clearInterval(fadeInterval);
            return
        }
        currentTrack.volume=Math.max(0,Math.min(1,currentTrack.volume+step));
        if((step>0&&currentTrack.volume>=targetVol)||(step<0&&currentTrack.volume<=targetVol)){
            currentTrack.volume=targetVol;
            clearInterval(fadeInterval)
        }
    },50)
}

function resumeMusic(){
    setTimeout(()=>{
        fadeMusic(targetMusicVolume,1)
    },500)
}

class EBullet{
    constructor(x,y,tx,ty,fast=false){
        this.x=x;this.y=y;
        const pattern=Math.random();
        if(pattern<0.4){
            const a=Math.atan2(ty-y,tx-x);
            const spd=fast?CFG.EBSPD*1.3:CFG.EBSPD;
            this.vx=Math.cos(a)*spd;
            this.vy=Math.sin(a)*spd
        }else if(pattern<0.6){
            const angle=rnd(-Math.PI/4,Math.PI/4);
            const spd=fast?CFG.EBSPD*1.2:CFG.EBSPD;
            this.vx=Math.sin(angle)*spd;
            this.vy=Math.cos(angle)*spd
        }else if(pattern<0.8){
            const offset=rnd(-100,100);
            const a=Math.atan2(ty-y,tx+offset-x);
            this.vx=Math.cos(a)*CFG.EBSPD;
            this.vy=Math.sin(a)*CFG.EBSPD
        }else{
            this.vx=rnd(-3,3);
            this.vy=CFG.EBSPD
        }
        this.sz=5;
        this.dead=false
    }
    update(){
        this.x+=this.vx;
        this.y+=this.vy;
        if(this.y>canvas.height+50||this.y<-50||this.x<-50||this.x>canvas.width+50)this.dead=true
    }
    draw(){
        ctx.save();
        ctx.shadowBlur=15;
        ctx.shadowColor='#ff0055';
        ctx.fillStyle='#ff0055';
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.sz,0,Math.PI*2);
        ctx.fill();
        ctx.globalAlpha=0.5;
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.sz+4,0,Math.PI*2);
        ctx.fill();
        ctx.restore()
    }
}

        ti=Math.max(0,Math.min(ti,CFG.ETYPES.length-1));
        this.t=CFG.ETYPES[ti];
        this.sz=this.t.sz;
        this.basehp=this.t.hp;
        this.mhp=Math.ceil(this.basehp*GS.hpMult);
        this.hp=this.mhp;
        this.spd=GS.spd*this.t.spd;
        this.c=this.t.c;
        this.sh=this.t.sh;
        this.rot=0;
        this.rspd=(rnd(-0.5,0.5))*0.04;
        this.pts=this.t.pts;
        this.cool=0;
        this.pls=rnd(0,Math.PI*2);
        this.frm=0;
        this.dead=false;
        this.movePattern=Math.random()<0.6?rndI(1,6):0;
        this.startX=x;
        this.shield=this.t.shield||0;
        this.kamikaze=this.t.kamikaze||false;
        this.splits=this.t.splits||false;
        if(this.kamikaze)this.movePattern=0;
        if(this.sh==='tank'&&Math.random()<0.25){
            this.sz*=3;
            this.hp=Math.ceil(this.hp*4);
            this.mhp=this.hp;
            this.pts=Math.floor(this.pts*3);
            this.supersize=true
        }else{
            this.supersize=false
        }
    }
    update(){
        this.frm++;
        if(this.kamikaze){
            const dx=GS.px-this.x;
            const dy=GS.py-this.y;
            const dist=Math.sqrt(dx*dx+dy*dy);
            if(dist>1){
                this.x+=dx/dist*this.spd;
                this.y+=dy/dist*this.spd
            }else{
                this.y+=this.spd
            }
        }else if(this.movePattern===1){
            this.x=this.startX+Math.sin(this.frm*0.05)*60;
            this.y+=this.spd*0.7
        }else if(this.movePattern===2){
            this.x+=Math.cos(this.frm*0.04)*3;
            this.y+=this.spd
        }else if(this.movePattern===3){
            if(this.frm%180<90)this.x+=2;
            else this.x-=2;
            this.y+=this.spd*0.85
        }else if(this.movePattern===4){
            this.x=this.startX+Math.cos(this.frm*0.03)*80;
            this.y+=this.spd*0.6
        }else if(this.movePattern===5){
            if(this.frm%120===0)this.startX+=rnd(-80,80);
            this.x+=(this.startX-this.x)*0.05;
            this.y+=this.spd*0.8
        }else if(this.movePattern===6){
            this.x+=Math.sin(this.frm*0.08)*4;
            this.y+=this.spd*0.9
        }else{
            this.y+=this.spd
        }
        this.rot+=this.rspd;
        this.pls+=0.08;
        if(!this.kamikaze&&this.basehp>=1&&this.cool<=0&&this.y>80&&this.y<canvas.height-200){
            if(Math.random()<GS.freq){
                ebul.push(new EBullet(this.x,this.y+this.sz/2,GS.px,GS.py));
                this.cool=80+rnd(0,80);
                playSound('shoot')
            }
        }
        this.cool--;
        const rd=getRd();
        this.x=Math.max(rd.l+this.sz/2,Math.min(rd.r-this.sz/2,this.x));
        if(this.y>canvas.height+100)this.dead=true
    }
    draw(){
        ctx.save();
        ctx.translate(this.x,this.y);
        const p=Math.sin(this.pls)*0.1+1;
        ctx.scale(p,p);
        ctx.shadowBlur=28;
        ctx.shadowColor=this.c;
        if(this.sh==='shielded'){
            ctx.save();
            ctx.rotate(this.frm*0.03);
            ctx.fillStyle=this.c;
            for(let i=0;i<5;i++){
                const angle=(Math.PI*2/5)*i;
                const x1=Math.cos(angle)*this.sz*0.35;
                const y1=Math.sin(angle)*this.sz*0.35;
                ctx.beginPath();
                ctx.moveTo(0,0);
                ctx.lineTo(x1,y1);
                ctx.strokeStyle=this.c;
                ctx.lineWidth=6;
                ctx.stroke();
                ctx.fillStyle=this.c;
                ctx.beginPath();
                ctx.arc(x1,y1,8,0,Math.PI*2);
                ctx.fill();
                ctx.strokeStyle='#fff';
                ctx.lineWidth=2;
                ctx.stroke()
            }
            ctx.fillStyle=this.c;
            ctx.beginPath();
            ctx.arc(0,0,this.sz*0.15,0,Math.PI*2);
            ctx.fill();
            ctx.strokeStyle='#fff';
            ctx.lineWidth=3;
            ctx.stroke();
            ctx.restore();
            if(this.shield>0){
                ctx.strokeStyle='#00ffff';
                ctx.lineWidth=3;
                ctx.setLineDash([8,8]);
                ctx.beginPath();
                ctx.arc(0,0,this.sz*0.5,0,Math.PI*2);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle='#00ffff';
                ctx.font='bold 16px Arial';
                ctx.textAlign='center';
                ctx.shadowBlur=10;
                ctx.shadowColor='#00ffff';
                ctx.fillText(this.shield,0,-this.sz*0.65)
            }
        }else if(this.sh==='kamikaze'){
            ctx.rotate(Math.atan2(GS.py-this.y,GS.px-this.x)+Math.PI/2);
            ctx.fillStyle=this.c;
            ctx.fillRect(-this.sz/4,-this.sz/2,this.sz/2,this.sz*0.7);
            ctx.beginPath();
            ctx.moveTo(0,-this.sz/2);
            ctx.lineTo(-this.sz/3,-this.sz*0.35);
            ctx.lineTo(this.sz/3,-this.sz*0.35);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle='#fff';
            ctx.lineWidth=3;
            ctx.strokeRect(-this.sz/4,-this.sz/2,this.sz/2,this.sz*0.7);
            ctx.fillStyle='#ff0000';
            ctx.fillRect(-this.sz/6,-this.sz*0.2,this.sz/3,this.sz*0.3);
            const flameSize=Math.sin(this.frm*0.3)*4+6;
            ctx.fillStyle='#ff6600';
            ctx.beginPath();
            ctx.moveTo(0,this.sz*0.2);
            ctx.lineTo(-flameSize,this.sz*0.2+flameSize);
            ctx.lineTo(flameSize,this.sz*0.2+flameSize);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle='#fff';
            ctx.beginPath();
            ctx.arc(0,-this.sz*0.1,this.sz*0.12,0,Math.PI*2);
            ctx.fill()
        }else if(this.sh==='splitter'){
            const wingFlap=Math.sin(this.frm*0.15)*0.3;
            ctx.fillStyle=this.c;
            ctx.fillRect(-this.sz*0.08,-this.sz*0.4,this.sz*0.16,this.sz*0.8);
            ctx.save();
            ctx.translate(-this.sz*0.2,0);
            ctx.rotate(wingFlap);
            ctx.fillStyle=this.c;
            ctx.beginPath();
            ctx.moveTo(0,-this.sz*0.3);
            ctx.bezierCurveTo(-this.sz*0.25,-this.sz*0.2,-this.sz*0.25,this.sz*0.2,0,this.sz*0.3);
            ctx.bezierCurveTo(this.sz*0.1,this.sz*0.2,this.sz*0.1,-this.sz*0.2,0,-this.sz*0.3);
            ctx.fill();
            ctx.strokeStyle='#fff';
            ctx.lineWidth=2;
            ctx.stroke();
            ctx.fillStyle='rgba(255,255,255,0.4)';
            ctx.beginPath();
            ctx.arc(-this.sz*0.08,0,this.sz*0.08,0,Math.PI*2);
            ctx.fill();
            ctx.restore();
            ctx.save();
            ctx.translate(this.sz*0.2,0);
            ctx.rotate(-wingFlap);
            ctx.fillStyle=this.c;
            ctx.beginPath();
            ctx.moveTo(0,-this.sz*0.3);
            ctx.bezierCurveTo(this.sz*0.25,-this.sz*0.2,this.sz*0.25,this.sz*0.2,0,this.sz*0.3);
            ctx.bezierCurveTo(-this.sz*0.1,this.sz*0.2,-this.sz*0.1,-this.sz*0.2,0,-this.sz*0.3);
            ctx.fill();
            ctx.strokeStyle='#fff';
            ctx.lineWidth=2;
            ctx.stroke();
            ctx.fillStyle='rgba(255,255,255,0.4)';
            ctx.beginPath();
            ctx.arc(this.sz*0.08,0,this.sz*0.08,0,Math.PI*2);
            ctx.fill();
            ctx.restore();
            ctx.fillStyle='#fff';
            ctx.beginPath();
            ctx.arc(0,-this.sz*0.35,this.sz*0.05,0,Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(0,-this.sz*0.25,this.sz*0.05,0,Math.PI*2);
            ctx.fill()
        }else if(this.sh==='convoy'){
            ctx.fillStyle='#334433';
            ctx.fillRect(-this.sz*0.45,-this.sz*0.3,this.sz*0.9,this.sz*0.6);
            ctx.strokeStyle='#445544';
            ctx.lineWidth=3;
            ctx.strokeRect(-this.sz*0.45,-this.sz*0.3,this.sz*0.9,this.sz*0.6);
            ctx.fillStyle=this.c;
            ctx.fillRect(-this.sz*0.35,-this.sz*0.4,this.sz*0.7,this.sz*0.35);
            ctx.strokeStyle='#667766';
            ctx.lineWidth=3;
            ctx.strokeRect(-this.sz*0.35,-this.sz*0.4,this.sz*0.7,this.sz*0.35);
            ctx.save();
            ctx.translate(0,-this.sz*0.22);
            ctx.fillStyle='#445544';
            ctx.fillRect(-this.sz*0.08,-this.sz*0.25,this.sz*0.5,this.sz*0.12);
            ctx.fillStyle='#222';
            ctx.fillRect(this.sz*0.42-this.sz*0.06,-this.sz*0.25+this.sz*0.03,this.sz*0.06,this.sz*0.06);
            ctx.strokeStyle='#888';
            ctx.lineWidth=2;
            ctx.strokeRect(-this.sz*0.08,-this.sz*0.25,this.sz*0.5,this.sz*0.12);
            ctx.restore();
            for(let i=0;i<4;i++){
                const x=-this.sz*0.5+i*this.sz*0.33;
                ctx.fillStyle='#223322';
                ctx.beginPath();
                ctx.arc(x,-this.sz*0.35,this.sz*0.08,0,Math.PI*2);
                ctx.fill();
                ctx.strokeStyle='#334433';
                ctx.lineWidth=2;
                ctx.stroke()
            }
            for(let i=0;i<4;i++){
                const x=-this.sz*0.5+i*this.sz*0.33;
                ctx.fillStyle='#223322';
                ctx.beginPath();
                ctx.arc(x,this.sz*0.35,this.sz*0.08,0,Math.PI*2);
                ctx.fill();
                ctx.strokeStyle='#334433';
                ctx.lineWidth=2;
                ctx.stroke()
            }
            ctx.fillStyle='#1a1a1a';
            ctx.fillRect(-this.sz*0.25,-this.sz*0.15,this.sz*0.5,this.sz*0.15);
            ctx.fillStyle='#ff4400';
            for(let i=0;i<2;i++){
                const x=-this.sz*0.15+i*this.sz*0.3;
                ctx.fillRect(x,-this.sz*0.08,this.sz*0.03,this.sz*0.05)
            }
            const hpPct=this.hp/this.mhp;
            ctx.fillStyle='rgba(0,0,0,0.8)';
            ctx.fillRect(-this.sz*0.45,this.sz*0.35,this.sz*0.9,8);
            ctx.fillStyle=hpPct>0.66?'#00ff00':hpPct>0.33?'#ffff00':'#ff0000';
            ctx.fillRect(-this.sz*0.45,this.sz*0.35,this.sz*0.9*hpPct,8);
            ctx.strokeStyle='#fff';
            ctx.lineWidth=1.5;
            ctx.strokeRect(-this.sz*0.45,this.sz*0.35,this.sz*0.9,8)
        }else if(this.sh==='scout'){
            ctx.rotate(this.rot*0.6);
            ctx.fillStyle=this.c;
            ctx.beginPath();
            ctx.moveTo(0,-this.sz/2);
            ctx.lineTo(this.sz/2.8,this.sz/4);
            ctx.lineTo(this.sz/4,this.sz/2);
            ctx.lineTo(-this.sz/4,this.sz/2);
            ctx.lineTo(-this.sz/2.8,this.sz/4);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle='#fff';
            ctx.lineWidth=3.5;
            ctx.stroke();
            ctx.fillStyle='rgba(0,0,0,0.5)';
            ctx.fillRect(-this.sz/4,0,this.sz/2,this.sz/3);
            const cs=6+Math.sin(this.frm*0.15)*3;
            const cg=ctx.createRadialGradient(0,0,0,0,0,cs);
            cg.addColorStop(0,'#fff');
            cg.addColorStop(0.4,this.c);
            cg.addColorStop(1,'transparent');
            ctx.fillStyle=cg;
            ctx.beginPath();
            ctx.arc(0,0,cs,0,Math.PI*2);
            ctx.fill();
            ctx.fillStyle=this.c;
            ctx.beginPath();
            ctx.moveTo(-this.sz/3,this.sz/2);
            ctx.lineTo(-this.sz/2.5,this.sz/1.5);
            ctx.lineTo(-this.sz/4,this.sz/2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(this.sz/3,this.sz/2);
            ctx.lineTo(this.sz/2.5,this.sz/1.5);
            ctx.lineTo(this.sz/4,this.sz/2);
            ctx.fill()
        }else if(this.sh==='fighter'){
            ctx.rotate(this.rot*0.3);
            ctx.fillStyle=this.c;
            ctx.fillRect(-this.sz/4,-this.sz/2,this.sz/2,this.sz);
            ctx.beginPath();
            ctx.moveTo(-this.sz/4,0);
            ctx.lineTo(-this.sz/2,-this.sz/4);
            ctx.lineTo(-this.sz/2,this.sz/4);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(this.sz/4,0);
            ctx.lineTo(this.sz/2,-this.sz/4);
            ctx.lineTo(this.sz/2,this.sz/4);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle='#fff';
            ctx.lineWidth=3.5;
            ctx.strokeRect(-this.sz/4,-this.sz/2,this.sz/2,this.sz);
            const cg=Math.sin(this.frm*0.1)*0.3+0.7;
            ctx.fillStyle=`rgba(255,255,255,${cg})`;
            ctx.fillRect(-this.sz/6,-this.sz/3,this.sz/3,this.sz/3)
        }else if(this.sh==='assault'){
            ctx.rotate(this.rot);
            ctx.fillStyle=this.c;
            ctx.fillRect(-this.sz/5,-this.sz/2,this.sz/2.5,this.sz);
            for(let i=0;i<4;i++){
                ctx.save();
                ctx.rotate((Math.PI/2)*i);
                ctx.translate(0,-this.sz/3);
                ctx.fillRect(-this.sz/8,0,this.sz/4,this.sz/2.5);
                ctx.restore()
            }
            ctx.strokeStyle='#fff';
            ctx.lineWidth=3;
            ctx.strokeRect(-this.sz/5,-this.sz/2,this.sz/2.5,this.sz)
        }else if(this.sh==='tank'){
            ctx.rotate(this.rot*0.5);
            ctx.fillStyle=this.c;
            ctx.beginPath();
            for(let i=0;i<6;i++){
                const a=(Math.PI/3)*i;
                const x=Math.cos(a)*this.sz/2;
                const y=Math.sin(a)*this.sz/2;
                if(i===0)ctx.moveTo(x,y);
                else ctx.lineTo(x,y)
            }
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle='#fff';
            ctx.lineWidth=5;
            ctx.stroke();
            for(let i=0;i<6;i++){
                ctx.save();
                ctx.rotate((Math.PI/3)*i);
                ctx.fillStyle='#333';
                ctx.fillRect(-this.sz*0.08,this.sz*0.35,this.sz*0.16,this.sz*0.15);
                ctx.strokeStyle='#555';
                ctx.lineWidth=2;
                ctx.strokeRect(-this.sz*0.08,this.sz*0.35,this.sz*0.16,this.sz*0.15);
                ctx.restore()
            }
            ctx.save();
            ctx.rotate(-this.frm*0.03);
            ctx.strokeStyle=this.c;
            ctx.lineWidth=8;
            ctx.beginPath();
            ctx.arc(0,0,this.sz*0.35,0,Math.PI*2);
            ctx.stroke();
            ctx.restore();
            ctx.fillStyle='#222';
            ctx.beginPath();
            ctx.arc(0,0,this.sz*0.25,0,Math.PI*2);
            ctx.fill();
            ctx.strokeStyle='#444';
            ctx.lineWidth=3;
            ctx.stroke();
            ctx.fillStyle=this.c;
            ctx.fillRect(-this.sz*0.08,-this.sz*0.6,this.sz*0.16,this.sz*0.5);
            ctx.fillRect(this.sz*0.08-this.sz*0.04,-this.sz*0.65,this.sz*0.08,this.sz*0.12);
            ctx.strokeStyle='#fff';
            ctx.lineWidth=3;
            ctx.strokeRect(-this.sz*0.08,-this.sz*0.6,this.sz*0.16,this.sz*0.5);
            const cg=Math.sin(this.frm*0.15)*0.4+0.6;
            ctx.fillStyle=`rgba(255,100,255,${cg})`;
            ctx.beginPath();
            ctx.arc(0,0,this.sz*0.12,0,Math.PI*2);
            ctx.fill()
        }else if(this.sh==='cruiser'){
            ctx.rotate(this.rot*0.3);
            ctx.fillStyle=this.c;
            ctx.fillRect(-this.sz/3,-this.sz/2,this.sz/1.5,this.sz);
            ctx.fillRect(-this.sz/2.2,-this.sz/3,this.sz/8,this.sz/1.5);
            ctx.fillRect(this.sz/3,-this.sz/3,this.sz/8,this.sz/1.5);
            ctx.strokeStyle='#fff';
            ctx.lineWidth=4.5;
            ctx.strokeRect(-this.sz/3,-this.sz/2,this.sz/1.5,this.sz);
            const eg=this.frm%4<2;
            ctx.fillStyle=eg?'#00ffff':'#00aaaa';
            ctx.fillRect(-this.sz/4,this.sz/2,this.sz/8,12);
            ctx.fillRect(this.sz/12,this.sz/2,this.sz/8,12)
        }else{
            ctx.rotate(this.rot*0.2);
            ctx.fillStyle=this.c;
            ctx.beginPath();
            for(let i=0;i<8;i++){
                const a=(Math.PI/4)*i,r=i%2===0?this.sz/2:this.sz/2.5,x=Math.cos(a)*r,y=Math.sin(a)*r;
                if(i===0)ctx.moveTo(x,y);
                else ctx.lineTo(x,y)
            }
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle='#fff';
            ctx.lineWidth=5;
            ctx.stroke();
            ctx.save();
            ctx.rotate(-this.frm*0.03);
            ctx.strokeStyle=this.c;
            ctx.lineWidth=7;
            ctx.beginPath();
            ctx.arc(0,0,this.sz/3,0,Math.PI*2);
            ctx.stroke();
            ctx.restore();
            const g=ctx.createRadialGradient(0,0,0,0,0,this.sz/4);
            g.addColorStop(0,'#fff');
            g.addColorStop(0.4,this.c);
            g.addColorStop(1,'transparent');
            ctx.fillStyle=g;
            ctx.beginPath();
            ctx.arc(0,0,this.sz/4+Math.sin(this.frm*0.1)*6,0,Math.PI*2);
            ctx.fill()
        }
        ctx.restore()
    }
    dmg(d=1){
        if(this.shield>0){
            this.shield--;
            playSound('hit');
            exp(this.x,this.y,'#00ffff',15);
            return
        }
        this.hp-=d;
        if(this.hp<=0){
            this.dead=true;
            const p=GS.dbl?this.pts*2:this.pts;
            GS.sc+=p;
            GS.kills++;
            exp(this.x,this.y,this.c,30);
            GS.shake=6+this.mhp*2;
            playSound('explosion');
            if(this.splits&&GS.et>=180){
                for(let i=0;i<2;i++){
                    const offset=i===0?-40:40;
                    const mini=new Enemy(this.x+offset,this.y,0);
                    mini.sz*=0.7;
                    mini.hp=1;
                    mini.mhp=1;
                    mini.pts=Math.floor(this.pts*0.3);
                    mini.shield=0;
                    mini.kamikaze=false;
                    mini.splits=false;
                    enm.push(mini)
                }
            }
        }else{
            playSound('hit')
        }
    }
}

class Boss{
    constructor(x,y,bossType){
        this.x=x;this.y=y;this.sz=180;
        const basehp=GS.diff==='easy'?560:840;
        this.hp=basehp*(1+GS.bossCount*0.2);
        this.mhp=this.hp;
        this.spd=1.8;
        const bossTypes=[
            {name:'INFERNO',mainColor:'#ff0000',accentColor:'#ff6600',glowColor:'#ff4400',shape:'skull',attack:'spread'},
            {name:'VOID',mainColor:'#8800ff',accentColor:'#cc00ff',glowColor:'#aa00ff',shape:'cross',attack:'spiral'},
            {name:'STORM',mainColor:'#00ff00',accentColor:'#00ff88',glowColor:'#00ffaa',shape:'triangle',attack:'laser'},
            {name:'NEBULA',mainColor:'#00ddff',accentColor:'#0099ff',glowColor:'#00bbff',shape:'ring',attack:'tracking'}
        ];
        this.type=bossTypes[bossType];
        this.name=this.type.name;
        this.mainColor=this.type.mainColor;
        this.accentColor=this.type.accentColor;
        this.glowColor=this.type.glowColor;
        this.shape=this.type.shape;
        this.attack=this.type.attack;
        this.pattern=1;
        this.patternT=0;
        this.cool=0;
        this.frm=0;
        this.dead=false;
        this.entering=true;
        this.vulnerable=false;
        this.targetY=150;
        this.angle=0;
        this.phase2=false;
        this.rage=false
    }
    update(){
        this.frm++;
        if(this.entering){
            if(this.y<this.targetY){
                this.y+=this.spd
            }else{
                this.entering=false;
                setTimeout(()=>{this.vulnerable=true},2000)
            }
            return
        }
        if(this.hp<this.mhp*0.3&&!this.rage){
            this.rage=true;
            this.cool=0
        }
        this.patternT++;
        if(this.patternT>180){
            this.pattern=(this.pattern%3)+1;
            this.patternT=0
        }
        const rd=getRd();
        this.y=Math.min(this.targetY,this.y);
        if(this.pattern===1){
            const moveX=Math.sin(this.frm*0.02)*6;
            this.x+=moveX;
            if(Math.random()<0.05)this.targetY=100+Math.random()*100
        }else if(this.pattern===2){
            this.x+=(GS.px-this.x)*0.015;
            this.y+=(this.targetY-this.y)*0.02
        }else{
            const side=Math.sin(this.frm*0.015);
            this.x+=(side>0?(rd.r-this.sz):(rd.l+this.sz)-this.x)*0.03
        }
        this.x=Math.max(rd.l+this.sz/2,Math.min(rd.r-this.sz/2,this.x));
        if(this.cool<=0&&this.vulnerable){
            const rageSpeed=this.rage?0.7:1;
            if(this.attack==='spread'){
                const num=this.rage?12:8;
                for(let i=0;i<num;i++){
                    const a=-Math.PI/3+((Math.PI*2/3)/(num-1))*i;
                    const vx=Math.sin(a)*GS.EBSPD;
                    const vy=Math.cos(a)*GS.EBSPD;
                    ebul.push(new EBullet(this.x,this.y+this.sz/2,this.x+vx*50,this.y+vy*50))
                }
                this.cool=(GS.diff==='easy'?50:40)*rageSpeed
            }else if(this.attack==='spiral'){
                const num=this.rage?6:4;
                for(let i=0;i<num;i++){
                    const a=(Math.PI*2/num)*i+this.angle;
                    const tx=this.x+Math.cos(a)*200;
                    const ty=this.y+Math.sin(a)*200;
                    ebul.push(new EBullet(this.x,this.y,tx,ty))
                }
                this.angle+=this.rage?0.5:0.3;
                this.cool=(GS.diff==='easy'?35:28)*rageSpeed
            }else if(this.attack==='laser'){
                const shots=this.rage?5:3;
                for(let i=0;i<shots;i++){
                    const offset=(i-Math.floor(shots/2))*40;
                    ebul.push(new EBullet(this.x+offset,this.y+this.sz/2,GS.px,GS.py,true))
                }
                this.cool=(GS.diff==='easy'?45:35)*rageSpeed
            }else{
                const num=this.rage?4:2;
                for(let i=0;i<num;i++){
                    setTimeout(()=>{
                        if(!this.dead)ebul.push(new EBullet(this.x,this.y+this.sz/2,GS.px,GS.py,true))
                    },i*200)
                }
                this.cool=(GS.diff==='easy'?60:48)*rageSpeed
            }
            playSound('shoot')
        }
        this.cool--;
    }
    draw(){
        ctx.save();
        ctx.translate(this.x,this.y);
        const pulse=Math.sin(this.frm*0.08)*(this.rage?0.15:0.08)+1;
        ctx.scale(pulse,pulse);
        ctx.shadowBlur=this.rage?70:50;
        ctx.shadowColor=this.glowColor;
        const bossColor=this.vulnerable?this.mainColor:this.glowColor+'88';
        if(this.shape==='skull'){
            ctx.fillStyle=bossColor;
            ctx.beginPath();
            ctx.arc(0,-20,this.sz/3,0,Math.PI);
            ctx.arc(-this.sz/6,0,this.sz/4.5,0,Math.PI*2);
            ctx.arc(this.sz/6,0,this.sz/4.5,0,Math.PI*2);
            ctx.fill();
            ctx.fillStyle='#000';
            ctx.beginPath();
            ctx.arc(-this.sz/8,-25,15,0,Math.PI*2);
            ctx.arc(this.sz/8,-25,15,0,Math.PI*2);
            ctx.fill();
            ctx.fillStyle=bossColor;
            ctx.beginPath();
            ctx.moveTo(-this.sz/3,this.sz/6);
            for(let i=0;i<8;i++){
                const x=-this.sz/3+(this.sz*2/3/8)*i;
                const y=i%2===0?this.sz/6:this.sz/3;
                ctx.lineTo(x,y)
            }
            ctx.lineTo(this.sz/3,this.sz/6);
            ctx.closePath();
            ctx.fill()
        }else if(this.shape==='cross'){
            ctx.fillStyle=bossColor;
            const w=this.sz/3,h=this.sz/2.5;
            ctx.fillRect(-w/2,-this.sz/2,w,this.sz);
            ctx.fillRect(-this.sz/2,-h/2,this.sz,h);
            ctx.save();
            ctx.rotate(this.frm*0.05);
            ctx.strokeStyle=this.accentColor;
            ctx.lineWidth=12;
            ctx.beginPath();
            ctx.arc(0,0,this.sz/3,0,Math.PI*2);
            ctx.stroke();
            ctx.restore();
            for(let i=0;i<4;i++){
                ctx.save();
                ctx.rotate((Math.PI/2)*i);
                ctx.fillStyle=this.glowColor;
                ctx.fillRect(-10,-this.sz/2-30,20,30);
                ctx.restore()
            }
        }else if(this.shape==='triangle'){
            ctx.fillStyle=bossColor;
            ctx.beginPath();
            ctx.moveTo(0,-this.sz/1.5);
            ctx.lineTo(-this.sz/2,this.sz/2.5);
            ctx.lineTo(this.sz/2,this.sz/2.5);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle='#fff';
            ctx.lineWidth=10;
            ctx.stroke();
            ctx.fillStyle='rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.moveTo(0,-this.sz/2.5);
            ctx.lineTo(-this.sz/4,this.sz/5);
            ctx.lineTo(this.sz/4,this.sz/5);
            ctx.closePath();
            ctx.fill();
            for(let i=0;i<3;i++){
                ctx.save();
                ctx.rotate((Math.PI*2/3)*i);
                ctx.fillStyle=this.accentColor;
                const pulse=Math.sin(this.frm*0.08+i)*0.3+0.7;
                ctx.globalAlpha=pulse;
                ctx.fillRect(-10,-this.sz/1.8,20,this.sz*0.4);
                ctx.globalAlpha=1;
                ctx.restore()
            }
            for(let i=0;i<3;i++){
                ctx.save();
                ctx.rotate((Math.PI*2/3)*i+this.frm*0.04);
                ctx.fillStyle=this.glowColor;
                ctx.beginPath();
                ctx.arc(0,-this.sz/2.2,22,0,Math.PI*2);
                ctx.fill();
                ctx.strokeStyle='#fff';
                ctx.lineWidth=4;
                ctx.stroke();
                const g=ctx.createRadialGradient(0,-this.sz/2.2,0,0,-this.sz/2.2,18);
                g.addColorStop(0,'#fff');
                g.addColorStop(0.6,this.glowColor);
                g.addColorStop(1,'transparent');
                ctx.fillStyle=g;
                ctx.beginPath();
                ctx.arc(0,-this.sz/2.2,18,0,Math.PI*2);
                ctx.fill();
                ctx.restore()
            }
            ctx.save();
            ctx.rotate(-this.frm*0.02);
            for(let i=0;i<6;i++){
                const angle=(Math.PI/3)*i;
                const x=Math.cos(angle)*this.sz*0.35;
                const y=Math.sin(angle)*this.sz*0.35;
                ctx.strokeStyle=this.glowColor+'66';
                ctx.lineWidth=2;
                ctx.beginPath();
                ctx.moveTo(0,0);
                ctx.lineTo(x,y);
                ctx.stroke()
            }
            ctx.restore()
        }else{
            ctx.strokeStyle=bossColor;
            ctx.lineWidth=25;
            ctx.beginPath();
            ctx.arc(0,0,this.sz/2.2,0,Math.PI*2);
            ctx.stroke();
            ctx.strokeStyle=this.accentColor;
            ctx.lineWidth=15;
            ctx.beginPath();
            ctx.arc(0,0,this.sz/3,0,Math.PI*2);
            ctx.stroke();
            ctx.save();
            ctx.rotate(this.frm*0.06);
            for(let i=0;i<8;i++){
                ctx.save();
                ctx.rotate((Math.PI/4)*i);
                ctx.fillStyle=this.glowColor;
                ctx.fillRect(-8,-this.sz/2-20,16,40);
                ctx.restore()
            }
            ctx.restore();
            ctx.fillStyle=bossColor;
            ctx.beginPath();
            ctx.arc(0,0,this.sz/5,0,Math.PI*2);
            ctx.fill()
        }
        if(!this.vulnerable){
            ctx.strokeStyle='#00ffff';
            ctx.lineWidth=5;
            ctx.setLineDash([10,10]);
            ctx.beginPath();
            ctx.arc(0,0,this.sz/1.8,0,Math.PI*2);
            ctx.stroke();
            ctx.setLineDash([])
        }
        const hpPct=this.hp/this.mhp;
        ctx.fillStyle='rgba(0,0,0,0.8)';
        ctx.fillRect(-this.sz/2,-this.sz/2-50,this.sz,15);
        const barColor=hpPct>0.6?'#00ff00':hpPct>0.3?'#ffff00':'#ff0000';
        ctx.fillStyle=barColor;
        ctx.fillRect(-this.sz/2,-this.sz/2-50,this.sz*hpPct,15);
        ctx.strokeStyle='#ffffff';
        ctx.lineWidth=3;
        ctx.strokeRect(-this.sz/2,-this.sz/2-50,this.sz,15);
        ctx.fillStyle=this.rage?'#ff0000':'#ffffff';
        ctx.font=this.rage?'bold 18px Audiowide':'bold 16px Audiowide';
        ctx.textAlign='center';
        ctx.shadowBlur=this.rage?20:10;
        ctx.shadowColor=this.rage?'#ff0000':this.mainColor;
        ctx.fillText(this.vulnerable?(this.rage?'RAGE!':this.name):'ENTERING...',0,-this.sz/2-70);
        ctx.restore()
    }
    dmg(d=1){
        if(!this.vulnerable)return;
        this.hp-=d;
        if(this.hp<=0){
            this.dead=true;
            const bonus=GS.diff==='easy'?25000:40000;
            GS.sc+=bonus;
            exp(this.x,this.y,this.mainColor,100);
            GS.shake=60;
            msg(`${this.name} DEFEATED!\n+${bonus.toLocaleString()}`,'#ff0');
            playSound('explosion');
            GS.bossActive=false;
            GS.bossCount++;
            const bossSchedule=[180,300,480,600];
            if(GS.bossCount<bossSchedule.length){
                GS.nextBoss=bossSchedule[GS.bossCount]
            }else{
                GS.nextBoss=GS.et+300
            }
        }else{
            playSound('hit')
        }
    }
}
class Coin{constructor(x,y){this.x=x;this.y=y;this.sz=26;this.spd=GS.spd*0.65;this.rot=0;this.frm=0;this.flt=rnd(0,Math.PI*2);this.dead=false}update(){this.y+=this.spd;this.rot+=0.12;this.frm++;if(this.y>canvas.height+100)this.dead=true}draw(){const fy=Math.sin(this.frm*0.1+this.flt)*5,per=Math.cos(this.rot),sx=Math.abs(per);ctx.save();ctx.translate(this.x,this.y+fy);ctx.shadowBlur=35;ctx.shadowColor='#ffff00';const g=ctx.createRadialGradient(0,0,0,0,0,this.sz);g.addColorStop(0,'#ffffee');g.addColorStop(0.3,'#ffff00');g.addColorStop(0.6,'#ffdd00');g.addColorStop(1,'#dd9900');ctx.fillStyle=g;ctx.save();ctx.scale(sx,1);ctx.beginPath();ctx.arc(0,0,this.sz,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffaa00';ctx.lineWidth=3.5;ctx.stroke();if(sx>0.3){ctx.strokeStyle='#cc8800';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,0,this.sz*0.7,0,Math.PI*2);ctx.stroke()}ctx.restore();if(sx>0.5){ctx.fillStyle='#885500';ctx.font=`bold ${this.sz*1.2}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.save();ctx.scale(sx,1);ctx.fillText('$',0,0);ctx.restore()}if(this.frm%15<3){ctx.fillStyle='#fff';ctx.shadowBlur=25;ctx.fillRect(-this.sz/3,0,this.sz/1.5,3);ctx.fillRect(0,-this.sz/3,3,this.sz/1.5)}ctx.restore()}col(){this.dead=true;const mult=GS.dbl?2:1;GS.coin+=mult;GS.sc+=CFG.COINV*mult;exp(this.x,this.y,'#ffff00',15);playSound('coin')}}

class Trap{
    constructor(ln,tp='spikes'){
        this.x=getLn(ln);
        this.y=-100;
        this.ln=ln;
        this.tp=tp;
        this.w=getRd().w/CFG.LANES;
        if(tp==='block'){
            this.h=150;
            this.dmg=30
        }else if(tp==='wall'){
            this.h=140;
            this.dmg=25
        }else{
            this.h=80;
            this.dmg=20
        }
        this.spd=GS.spd;
        this.frm=0;
        this.dead=false
    }
    update(){
        this.y+=this.spd;
        this.frm++;
        if(this.y>canvas.height+150)this.dead=true
    }
    draw(){
        ctx.save();
        const lx=getLn(this.ln),lw=getRd().w/CFG.LANES;
        if(this.tp==='block'){
            const fl=this.frm%20<10;
            ctx.fillStyle=fl?'#ff0000':'#aa0000';
            ctx.shadowBlur=fl?45:25;
            ctx.shadowColor='#ff0000';
            ctx.fillRect(lx-lw/2,this.y-this.h/2,lw,this.h);
            ctx.fillStyle=fl?'#ffff00':'#ffaa00';
            for(let i=0;i<5;i++){
                const y=this.y-this.h/2+i*30;
                ctx.fillRect(lx-lw/2,y,lw,12)
            }
            ctx.fillStyle='#fff';
            ctx.font='bold 22px Arial';
            ctx.textAlign='center';
            ctx.shadowBlur=12;
            ctx.fillText('BLOCKED',lx,this.y)
        }else if(this.tp==='wall'){
            ctx.shadowBlur=35;
            ctx.shadowColor='#8800ff';
            const g=ctx.createLinearGradient(lx-lw/2,this.y-this.h/2,lx+lw/2,this.y+this.h/2);
            g.addColorStop(0,'#8800ff');
            g.addColorStop(0.5,'#aa00ff');
            g.addColorStop(1,'#5500aa');
            ctx.fillStyle=g;
            ctx.fillRect(lx-lw/2,this.y-this.h/2,lw,this.h);
            ctx.strokeStyle='#fff';
            ctx.lineWidth=5;
            ctx.strokeRect(lx-lw/2,this.y-this.h/2,lw,this.h);
            ctx.fillStyle='rgba(200,150,255,0.3)';
            ctx.fillRect(lx-lw/2+10,this.y-this.h/2+10,lw-20,this.h-20);
            for(let i=0;i<6;i++){
                const x=lx-lw/2+(lw/6)*i+lw/12;
                ctx.strokeStyle='#8800ff';
                ctx.lineWidth=3;
                ctx.beginPath();
                ctx.moveTo(x,this.y-this.h/2);
                ctx.lineTo(x,this.y+this.h/2);
                ctx.stroke()
            }
            ctx.fillStyle='#fff';
            ctx.font='bold 20px Arial';
            ctx.textAlign='center';
            ctx.shadowBlur=15;
            ctx.shadowColor='#8800ff';
            if(this.frm%40<20)ctx.fillText('WALL',lx,this.y)
        }else{
            ctx.shadowBlur=25;
            ctx.shadowColor='#ff0055';
            const sc=8;
            for(let i=0;i<sc;i++){
                const x=lx-lw/2+(lw/sc)*i+lw/(sc*2);
                const sh=28+Math.sin(this.frm*0.1+i)*6;
                ctx.fillStyle='#ff0055';
                ctx.beginPath();
                ctx.moveTo(x,this.y);
                ctx.lineTo(x-9,this.y+sh);
                ctx.lineTo(x+9,this.y+sh);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle='#ff0088';
                ctx.lineWidth=2.5;
                ctx.stroke()
            }
            ctx.fillStyle='#660022';
            ctx.fillRect(lx-lw/2,this.y+28,lw,16)
        }
        ctx.restore()
    }
}

class Pwr{constructor(x,y,tp){this.x=x;this.y=y;this.tp=tp;this.sz=36;this.spd=GS.spd*0.5;this.pls=0;this.rot=0;this.dead=false}update(){this.y+=this.spd;this.pls+=0.18;this.rot+=0.06;if(this.y>canvas.height+100)this.dead=true}draw(){const sz=this.sz+Math.sin(this.pls)*8;let c='#fff',s='';if(this.tp==='weapon'){c='#ff00ff';s='⚡'}else if(this.tp==='power'){c='#ff6600';s='⬆'}else if(this.tp==='health'){c='#00ff00';s='+'}else if(this.tp==='shield'){c='#00ffff';s='◆'}else if(this.tp==='double'){c='#ffff00';s='x2'}else{c='#ff0055';s='💣'}ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot);ctx.shadowBlur=40;ctx.shadowColor=c;ctx.strokeStyle=c;ctx.lineWidth=5.5;ctx.strokeRect(-sz/2,-sz/2,sz,sz);ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(-sz/2+4,-sz/2+4,sz-8,sz-8);ctx.fillStyle=c;ctx.font=`bold ${sz*0.55}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s,0,0);ctx.restore()}col(){this.dead=true;if(this.tp==='weapon'){let weaponPool;if(GS.et<120){if(Math.random()<0.7){weaponPool=[0,1,3]}else{weaponPool=[0,1,2,3,4]}}else{weaponPool=[0,1,2,3,4]}const avail=weaponPool.filter(i=>i!==GS.wi);if(avail.length>0){GS.wi=avail[rndI(0,avail.length-1)];const basePower=GS.et>=240?3:0;GS.wpwr=basePower;msg(`NEW WEAPON!\n${CFG.WPNS[GS.wi].n}`,CFG.WPNS[GS.wi].c)}else{GS.wi=rndI(1,4);GS.wpwr=0;msg(`WEAPON CHANGE!\n${CFG.WPNS[GS.wi].n}`,CFG.WPNS[GS.wi].c)}}else if(this.tp==='power'){GS.wpwr=Math.min(5,GS.wpwr+1);msg(`WEAPON POWER +1\nLVL ${GS.wpwr}`,'#f60')}else if(this.tp==='health'){GS.hp=Math.min(CFG.MAX_HEALTH,GS.hp+30);msg('HEALTH +30','#0f0')}else if(this.tp==='shield'){GS.shld=true;GS.shldT=500;msg('SHIELD ACTIVE!','#0ff')}else if(this.tp==='double'){GS.dbl=true;GS.dblT=600;msg('DOUBLE POINTS\n& COINS!','#ff0')}else{let bs=0;enm.forEach(e=>{if(!e.dead){bs+=e.pts;GS.kills++;exp(e.x,e.y,e.c,20)}});trap.forEach(t=>{if(!t.dead)exp(getLn(t.ln),t.y,'#ff0055',30)});GS.sc+=bs;enm=[];trap=[];GS.shake=35;msg(`MEGA BOMB!\n+${bs.toLocaleString()}`,'#f05')}GS.sc+=100; function spEnm(){
    const ln=rndI(0,CFG.LANES-1),x=getLn(ln);
    let ti=0;
    const r=Math.random();
    const hasNewEnemies=GS.et>=180;
    
    if(hasNewEnemies&&r<0.12){
        ti=12+Math.floor(Math.random()*4);
    }else if(GS.tier>=10){
        if(r<0.2)ti=rndI(0,2);
        else if(r<0.4)ti=rndI(3,5);
        else if(r<0.6)ti=rndI(6,7);
        else if(r<0.8)ti=rndI(8,10);
        else ti=11
    }else if(GS.tier>=7){
        if(r<0.25)ti=rndI(0,2);
        else if(r<0.5)ti=rndI(3,5);
        else if(r<0.7)ti=rndI(6,7);
        else if(r<0.9)ti=rndI(8,10);
        else ti=11
    }else if(GS.tier>=5){
        if(r<0.3)ti=rndI(0,2);
        else if(r<0.55)ti=rndI(3,5);
        else if(r<0.75)ti=rndI(6,7);
        else if(r<0.92)ti=rndI(8,10);
        else ti=11
    }else if(GS.tier>=4){
        if(r<0.35)ti=rndI(0,2);
        else if(r<0.65)ti=rndI(3,5);
        else if(r<0.9)ti=rndI(6,8);
        else ti=rndI(9,10)
    }else if(GS.tier>=3){
        if(r<0.4)ti=rndI(0,2);
        else if(r<0.75)ti=rndI(3,5);
        else ti=rndI(6,8)
    }else if(GS.tier>=2){
        if(r<0.5)ti=rndI(0,2);
        else if(r<0.88)ti=rndI(3,5);
        else ti=rndI(6,7)
    }else if(GS.tier>=1){
        if(r<0.6)ti=rndI(0,2);
        else ti=rndI(3,5)
    }else{
        if(r<0.75)ti=rndI(0,2);
        else ti=rndI(3,4)
    }
    try{
        enm.push(new Enemy(x,-80,ti));
        if(ti>=12)console.log('NEW ENEMY SPAWNED:',ti,CFG.ETYPES[ti].n,'at time:',GS.et);
    }catch(err){
        console.error('Enemy spawn error:',err,ti);
    }
}

function togMute(){soundEnabled=!soundEnabled;const mb=document.getElementById('muteBtn');if(!soundEnabled){mb.textContent='🔇';mb.classList.add('active');stopAllMusic()}else{mb.textContent='🔊';mb.classList.remove('active');if(GS.run&&!GS.pause)playNextMusic()}}

function gameOver(){GS.run=false;GS.shake=35;unlockMouse();stopAllMusic();playSound('explosion');const fsc=Math.floor(GS.sc),fcn=GS.coin,cbn=fcn*CFG.COINB,tot=fsc+cbn,m=Math.floor(GS.et/60),s=Math.floor(GS.et%60),tstr=`${m}:${s.toString().padStart(2,'0')}`;document.getElementById('finalScore').textContent=tot.toLocaleString();document.getElementById('finalKills').textContent=GS.kills.toLocaleString();document.getElementById('finalCoins').textContent=fcn;document.getElementById('coinBonus').textContent=`+${cbn.toLocaleString()}`;document.getElementById('finalTime').textContent=tstr;document.getElementById('finalDiff').textContent=DIFF_CONFIGS[GS.diff].name;saveHighScore(tot,fcn,tstr,GS.diff);displayHighScores(tot,GS.diff);displayAchievements();setTimeout(()=>document.getElementById('gameOverScreen').classList.add('show'),1000)}

window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')GS.mvL=true;if(e.key==='ArrowRight'||e.key==='d')GS.mvR=true;if(e.key==='ArrowUp'||e.key==='w')GS.mvU=true;if(e.key==='ArrowDown'||e.key==='s')GS.mvD=true;if(e.key===' '||e.key==='Enter'){GS.fire=true;e.preventDefault()}if(e.key==='p'||e.key==='Escape'){togPause();e.preventDefault()}if(e.key==='m')togMute()});
window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')GS.mvL=false;if(e.key==='ArrowRight'||e.key==='d')GS.mvR=false;if(e.key==='ArrowUp'||e.key==='w')GS.mvU=false;if(e.key==='ArrowDown'||e.key==='s')GS.mvD=false;if(e.key===' '||e.key==='Enter')GS.fire=false});

canvas.addEventListener('contextmenu',e=>e.preventDefault());
let mouseLocked=false;
canvas.addEventListener('click',()=>{if(!isMobile&&!mouseLocked&&GS.run){canvas.requestPointerLock=canvas.requestPointerLock||canvas.mozRequestPointerLock;canvas.requestPointerLock();mouseLocked=true}});
document.addEventListener('pointerlockchange',()=>{mouseLocked=document.pointerLockElement===canvas||document.mozPointerLockElement===canvas});
document.addEventListener('mousemove',e=>{if(!isMobile&&GS.run&&mouseLocked){const rd=getRd();GS.tx=Math.max(rd.l+15,Math.min(rd.r-15,GS.tx+e.movementX*0.8));GS.ty=Math.max(canvas.height*0.5,Math.min(canvas.height-80,GS.ty+e.movementY*0.8))}});
canvas.addEventListener('mousedown',e=>{e.preventDefault();if(!isMobile)GS.fire=true});
canvas.addEventListener('mouseup',e=>{e.preventDefault();if(!isMobile)GS.fire=false});
document.addEventListener('mouseup',()=>{GS.fire=false});

if(isMobile){document.getElementById('mobileControls').classList.add('active');let lti=null,rti=null;document.getElementById('btnLeft').addEventListener('touchstart',e=>{GS.mvL=true;lti=e.changedTouches[0].identifier;e.preventDefault()},{passive:false});document.getElementById('btnLeft').addEventListener('touchend',e=>{if(lti!==null){for(let t of e.changedTouches){if(t.identifier===lti){GS.mvL=false;lti=null}}}e.preventDefault()},{passive:false});document.getElementById('btnRight').addEventListener('touchstart',e=>{GS.mvR=true;rti=e.changedTouches[0].identifier;e.preventDefault()},{passive:false});document.getElementById('btnRight').addEventListener('touchend',e=>{if(rti!==null){for(let t of e.changedTouches){if(t.identifier===rti){GS.mvR=false;rti=null}}}e.preventDefault()},{passive:false})}

document.getElementById('easyBtn').addEventListener('click',()=>{selectedDifficulty='easy';document.getElementById('easyBtn').classList.add('selected');document.getElementById('hardBtn').classList.remove('selected')});
document.getElementById('hardBtn').addEventListener('click',()=>{selectedDifficulty='hard';document.getElementById('hardBtn').classList.add('selected');document.getElementById('easyBtn').classList.remove('selected')});
document.getElementById('pauseBtn').addEventListener('click',togPause);
document.getElementById('muteBtn').addEventListener('click',togMute);
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('playAgainBtn').addEventListener('click',startGame);

function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;GS.py=canvas.height-110;if(GS.px){const rd=getRd();GS.px=Math.max(rd.l+25,Math.min(rd.r-25,GS.px));GS.tx=GS.px}}
function loop(){upd();drw();requestAnimationFrame(loop)}
window.addEventListener('resize',resize);
resize();initSounds();loop();
window.addEventListener('blur',()=>{
    GS.fire=false;
    GS.mvL=false;
    GS.mvR=false;
    GS.mvU=false;
    GS.mvD=false;
});
window.addEventListener('visibilitychange',()=>{
    if(document.hidden){
        GS.fire=false;
        GS.mvL=false;
        GS.mvR=false;
        GS.mvU=false;
        GS.mvD=false;
    }
});
console.log('PERFECT!');
</script>
</body>
</html>
